<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Caixa Rápido - Festa Junina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { -webkit-tap-highlight-color: transparent; }

    .quick-btn, .danger-btn, .main-btn, .secondary-btn, .qty-btn {
      touch-action: manipulation;
      user-select: none;
    }

    .quick-btn {
      background: #ffedd5;
      border: 3px solid #fdba74;
      color: #9a3412;
      font-weight: 1000;
      border-radius: 18px;
      min-height: 58px;
      font-size: 1.35rem;
      box-shadow: 0 4px 0 #fb923c;
    }


    .qty-wrap {
      display: grid;
      grid-template-columns: 58px minmax(110px, 1fr) 58px;
      gap: 10px;
      align-items: stretch;
      width: 100%;
    }

    .qty-btn {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      border: 3px solid #fdba74;
      background: #fff7ed;
      color: #9a3412;
      font-size: 2rem;
      line-height: 1;
      font-weight: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #fb923c;
    }

    .qty-input {
      width: 100%;
      min-width: 0;
      height: 58px;
      border-radius: 16px;
      border: 3px solid #fdba74;
      text-align: center;
      font-size: 1.9rem;
      font-weight: 1000;
      color: #7c2d12;
      outline: none;
      background: #ffffff;
      padding: 0 8px;
    }

    .qty-input::-webkit-inner-spin-button,
    .qty-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .qty-input { -moz-appearance: textfield; }

    @media (min-width: 768px) {
      .quick-btn { min-height: 50px; font-size: 1.05rem; border-radius: 14px; }

      .qty-wrap {
        grid-template-columns: 48px 96px 48px;
        gap: 8px;
        width: 200px;
        max-width: 200px;
      }

      .qty-btn {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        font-size: 1.55rem;
      }

      .qty-input {
        height: 48px;
        font-size: 1.45rem;
        border-radius: 12px;
      }
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-orange-100 via-yellow-50 to-amber-100 p-2 sm:p-4">
  <main class="mx-auto max-w-5xl">
    <header class="sticky top-0 z-20 mb-3 rounded-b-3xl border-4 border-orange-400 bg-white/95 p-3 shadow-xl backdrop-blur sm:static sm:rounded-3xl sm:p-5">
      <div class="flex flex-col items-center justify-between gap-2 sm:flex-row">
        <div>
          <h1 class="text-center text-4xl font-black tracking-tight text-orange-700 sm:text-left sm:text-5xl">CAIXA RÁPIDO</h1>
          <p class="text-center text-xl font-extrabold text-stone-600 sm:text-left">Festa Junina</p>
        </div>
        <div class="rounded-2xl bg-orange-100 px-5 py-3 text-center border-2 border-orange-300">
          <p class="text-sm font-black text-orange-700">TOTAL</p>
          <p id="totalTopo" class="text-3xl font-black text-orange-900">R$ 0,00</p>
        </div>
      </div>
    </header>

    <section class="grid gap-4 lg:grid-cols-[1.1fr_0.9fr]">
      <section class="rounded-3xl border-4 border-orange-300 bg-white p-3 shadow-xl sm:p-5">
        <h2 class="mb-3 text-center text-3xl font-black text-orange-800">MONTAR VENDA</h2>

        <div class="rounded-3xl bg-orange-50 p-3 border-2 border-orange-200">
          <label class="mb-1 block text-xl font-black text-stone-700">Valor do item</label>
          <div class="grid gap-3 md:grid-cols-[1fr_200px] md:items-end">
            <input id="calcValor" type="text" inputmode="numeric" placeholder="R$ 0,00"
              class="h-20 w-full rounded-2xl border-4 border-orange-300 bg-white p-4 text-center text-5xl font-black text-orange-900 outline-none focus:border-orange-600 md:h-16 md:text-4xl" />

            <div>
              <label class="mb-1 block text-xl font-black text-stone-700 md:text-base">Quantidade</label>
              <div class="qty-wrap">
                <button type="button" class="qty-btn" onclick="mudarQtdCadastro(-1)">−</button>
                <input id="calcQtd" class="qty-input" type="number" min="1" step="1" value="1" inputmode="numeric" />
                <button type="button" class="qty-btn" onclick="mudarQtdCadastro(1)">+</button>
              </div>
            </div>
          </div>

          <button onclick="adicionarItem()"
            class="main-btn mt-3 h-20 w-full rounded-2xl bg-orange-600 text-3xl font-black text-white shadow-lg shadow-orange-200 active:scale-[0.99] md:h-16 md:text-2xl">
            + ADICIONAR ITEM
          </button>
        </div>

        <div class="mt-3 grid grid-cols-4 gap-2 md:grid-cols-8">
          <button onclick="valorRapido(1)" class="quick-btn">R$ 1</button>
          <button onclick="valorRapido(2)" class="quick-btn">R$ 2</button>
          <button onclick="valorRapido(3)" class="quick-btn">R$ 3</button>
          <button onclick="valorRapido(4)" class="quick-btn">R$ 4</button>
          <button onclick="valorRapido(5)" class="quick-btn">R$ 5</button>
          <button onclick="valorRapido(6)" class="quick-btn">R$ 6</button>
          <button onclick="valorRapido(8)" class="quick-btn">R$ 8</button>
          <button onclick="valorRapido(10)" class="quick-btn">R$ 10</button>
        </div>

        <div class="mt-4 rounded-3xl border-4 border-orange-200 bg-orange-50 p-3">
          <div class="mb-2 flex items-center justify-between gap-2">
            <h3 class="text-2xl font-black text-orange-900">ITENS</h3>
            <button onclick="limparItens()" class="rounded-xl bg-red-100 px-4 py-2 text-sm font-black text-red-700 border-2 border-red-300">LIMPAR ITENS</button>
          </div>
          <div id="listaItens" class="space-y-3"></div>
          <p id="semItens" class="rounded-2xl bg-white p-4 text-center text-xl font-bold text-stone-500">Nenhum item adicionado.</p>
        </div>
      </section>

      <aside class="space-y-4">
        <section class="rounded-3xl border-4 border-green-300 bg-white p-3 shadow-xl sm:p-5">
          <h2 class="mb-3 text-center text-3xl font-black text-green-800">TROCO</h2>

          <label class="block text-2xl font-black text-stone-700">TOTAL DA VENDA</label>
          <input id="compra" type="text" inputmode="numeric" placeholder="R$ 0,00"
            class="mt-1 h-20 w-full rounded-2xl border-4 border-orange-300 bg-orange-50 p-4 text-center text-5xl font-black text-orange-900 outline-none focus:border-orange-600 md:h-16 md:text-4xl" />

          <label class="mt-4 block text-2xl font-black text-stone-700">CLIENTE DEU</label>
          <input id="recebido" type="text" inputmode="numeric" placeholder="R$ 0,00"
            class="mt-1 h-20 w-full rounded-2xl border-4 border-green-300 bg-green-50 p-4 text-center text-5xl font-black text-green-900 outline-none focus:border-green-600 md:h-16 md:text-4xl" />
        </section>

        <section id="resultado" class="rounded-3xl border-4 border-stone-300 bg-white p-3 shadow-xl sm:p-5 hidden">
          <div id="caixaTroco" class="rounded-3xl p-4 text-center">
            <p class="text-3xl font-black">TROCO</p>
            <p id="troco" class="mt-1 break-words text-6xl font-black sm:text-7xl"></p>
          </div>

          <div class="mt-3 rounded-3xl border-4 border-yellow-300 bg-yellow-50 p-4">
            <h2 class="mb-2 text-2xl font-black text-yellow-800">ENTREGAR:</h2>
            <ul id="detalhes" class="space-y-2 text-2xl font-black text-stone-900"></ul>
          </div>
        </section>

        <button onclick="limparTudo()" class="danger-btn h-16 w-full rounded-2xl bg-red-600 text-2xl font-black text-white shadow-lg">
          NOVA VENDA / LIMPAR TUDO
        </button>
      </aside>
    </section>
  </main>

  <script>
    const compra = document.getElementById("compra");
    const recebido = document.getElementById("recebido");
    const resultado = document.getElementById("resultado");
    const trocoEl = document.getElementById("troco");
    const detalhes = document.getElementById("detalhes");
    const caixaTroco = document.getElementById("caixaTroco");
    const calcValor = document.getElementById("calcValor");
    const calcQtd = document.getElementById("calcQtd");
    const listaItens = document.getElementById("listaItens");
    const totalCalc = document.getElementById("totalTopo");
    const semItens = document.getElementById("semItens");

    let itens = [];

    function formatar(valor) {
      return valor.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function aplicarMascara(input) {
      let valor = input.value.replace(/\D/g, "");
      if (valor === "") { input.value = ""; return; }
      input.value = formatar(Number(valor) / 100);
    }

    function pegarCentavos(input) {
      return Number((input.value || "").replace(/\D/g, "") || 0);
    }

    function valorRapido(valor) {
      calcValor.value = formatar(valor);
      calcQtd.focus();
      calcQtd.select();
    }

    function mudarQtdCadastro(delta) {
      const atual = Math.max(1, parseInt(calcQtd.value || "1", 10));
      calcQtd.value = Math.max(1, atual + delta);
    }

    function mudarQtdItem(index, delta) {
      itens[index].qtd = Math.max(1, Number(itens[index].qtd || 1) + delta);
      renderizarItens();
    }

    function adicionarItem() {
      const valor = pegarCentavos(calcValor);
      const qtd = Math.max(1, Number(calcQtd.value || 1));
      if (valor <= 0) {
        calcValor.focus();
        return;
      }
      itens.push({ valor, qtd });
      calcValor.value = "";
      calcQtd.value = "1";
      renderizarItens();
      calcValor.focus();
    }

    function renderizarItens() {
      listaItens.innerHTML = "";
      semItens.classList.toggle("hidden", itens.length > 0);

      itens.forEach((item, index) => {
        const subtotal = item.valor * item.qtd;
        const div = document.createElement("div");
        div.className = "rounded-3xl border-4 border-orange-300 bg-white p-3 shadow-sm";
        div.innerHTML = `
          <div class="grid gap-3 md:grid-cols-[90px_1fr_200px_145px_92px] md:items-center">
            <p class="text-2xl font-black text-orange-800 md:text-xl">Item ${index + 1}</p>

            <div>
              <label class="block text-sm font-black text-stone-500">Valor</label>
              <input value="${formatar(item.valor / 100)}" inputmode="numeric"
                oninput="aplicarMascara(this); editarValor(${index}, this)"
                class="h-16 w-full rounded-2xl border-3 border-stone-300 bg-orange-50 p-3 text-center text-3xl font-black text-orange-900 outline-none md:h-12 md:text-xl">
            </div>

            <div>
              <label class="block text-sm font-black text-stone-500">Quantidade</label>
              <div class="qty-wrap">
                <button type="button" class="qty-btn" onclick="mudarQtdItem(${index}, -1)">−</button>
                <input value="${item.qtd}" type="number" min="1" step="1" inputmode="numeric"
                  oninput="editarQtd(${index}, this.value)" class="qty-input">
                <button type="button" class="qty-btn" onclick="mudarQtdItem(${index}, 1)">+</button>
              </div>
            </div>

            <div>
              <label class="block text-sm font-black text-stone-500">Subtotal</label>
              <input value="${formatar(subtotal / 100)}" inputmode="numeric"
                oninput="aplicarMascara(this); editarSubtotal(${index}, this)"
                class="subtotal-input h-16 w-full rounded-2xl border-3 border-orange-300 bg-orange-100 p-3 text-center text-3xl font-black text-orange-900 outline-none md:h-12 md:text-xl">
            </div>

            <button onclick="removerItem(${index})" class="h-14 rounded-2xl bg-red-600 px-4 text-xl font-black text-white md:h-12 md:text-base">
              APAGAR
            </button>
          </div>
        `;
        listaItens.appendChild(div);
      });
      atualizarTotal();
    }

    function editarValor(index, input) {
      itens[index].valor = pegarCentavos(input);

      const linha = input.closest('.grid');
      const subtotalInput = linha ? linha.querySelector('.subtotal-input') : null;
      const subtotal = itens[index].valor * itens[index].qtd;

      if (subtotalInput) {
        subtotalInput.value = formatar(subtotal / 100);
      }

      atualizarTotal();
    }

    function editarSubtotal(index, input) {
      const subtotal = pegarCentavos(input);
      const qtd = Math.max(1, Number(itens[index].qtd || 1));

      itens[index].valor = subtotal > 0 ? Math.round(subtotal / qtd) : 0;

      const linha = input.closest('.grid');
      const valorInput = linha ? linha.querySelector('input:not(.qty-input):not(.subtotal-input)') : null;

      if (valorInput) {
        valorInput.value = formatar(itens[index].valor / 100);
      }

      atualizarTotal();
    }

    function editarQtd(index, valor) {
      itens[index].qtd = Math.max(1, Number(valor || 1));
      renderizarItens();
    }

    function removerItem(index) {
      itens.splice(index, 1);
      renderizarItens();
    }

    function limparItens() {
      itens = [];
      listaItens.innerHTML = "";
      semItens.classList.remove("hidden");
      totalCalc.textContent = "R$ 0,00";
      compra.value = "";
      recebido.value = "";
      detalhes.innerHTML = "";
      trocoEl.textContent = "";
      resultado.classList.add("hidden");
      calcValor.value = "";
      calcQtd.value = "1";
      calcValor.focus();
    }

    function atualizarTotal() {
      const total = itens.reduce((soma, item) => soma + item.valor * item.qtd, 0);
      totalCalc.textContent = formatar(total / 100);
      compra.value = total > 0 ? formatar(total / 100) : "";
      if (total <= 0) {
        detalhes.innerHTML = "";
        trocoEl.textContent = "";
        resultado.classList.add("hidden");
      } else {
        calcularTroco();
      }
    }


    function calcularTroco() {
      const valorCompra = pegarCentavos(compra);
      const valorRecebido = pegarCentavos(recebido);
      detalhes.innerHTML = "";

      if (valorCompra <= 0) {
        resultado.classList.add("hidden");
        return;
      }

      resultado.classList.remove("hidden");

      if (valorRecebido < valorCompra) {
        const falta = (valorCompra - valorRecebido) / 100;
        caixaTroco.className = "rounded-3xl p-4 text-center bg-red-100 border-4 border-red-500";
        trocoEl.className = "mt-1 break-words text-5xl font-black text-red-700 sm:text-6xl";
        trocoEl.textContent = "FALTA " + formatar(falta);
        detalhes.innerHTML = "<li>O CLIENTE DEU MENOS.</li>";
        return;
      }

      const troco = valorRecebido - valorCompra;
      caixaTroco.className = "rounded-3xl p-4 text-center bg-green-100 border-4 border-green-500";
      trocoEl.className = "mt-1 break-words text-6xl font-black text-green-700 sm:text-7xl";
      trocoEl.textContent = formatar(troco / 100);

      if (troco === 0) {
        detalhes.innerHTML = "<li>NÃO TEM TROCO.</li>";
        return;
      }
      gerarNotasMoedas(troco);
    }

    function gerarNotasMoedas(valorCentavos) {
      const valores = [
        { nome: "nota de R$ 100", centavos: 10000 },
        { nome: "nota de R$ 50", centavos: 5000 },
        { nome: "nota de R$ 20", centavos: 2000 },
        { nome: "nota de R$ 10", centavos: 1000 },
        { nome: "nota de R$ 5", centavos: 500 },
        { nome: "nota de R$ 2", centavos: 200 },
        { nome: "moeda de R$ 1", centavos: 100 },
        { nome: "moeda de R$ 0,50", centavos: 50 },
        { nome: "moeda de R$ 0,25", centavos: 25 },
        { nome: "moeda de R$ 0,10", centavos: 10 },
        { nome: "moeda de R$ 0,05", centavos: 5 }
      ];
      let restante = valorCentavos;
      valores.forEach(item => {
        const qtd = Math.floor(restante / item.centavos);
        if (qtd > 0) {
          const li = document.createElement("li");
          li.textContent = `${qtd} x ${item.nome}`;
          detalhes.appendChild(li);
          restante -= qtd * item.centavos;
        }
      });
    }

    function limparTudo() {
      compra.value = "";
      recebido.value = "";
      calcValor.value = "";
      calcQtd.value = "1";
      itens = [];
      listaItens.innerHTML = "";
      semItens.classList.remove("hidden");
      detalhes.innerHTML = "";
      trocoEl.textContent = "";
      totalCalc.textContent = "R$ 0,00";
      resultado.classList.add("hidden");
      calcValor.focus();
    }

    compra.addEventListener("input", () => { aplicarMascara(compra); calcularTroco(); });
    recebido.addEventListener("input", () => { aplicarMascara(recebido); calcularTroco(); });
    calcValor.addEventListener("input", () => aplicarMascara(calcValor));
    calcQtd.addEventListener("keydown", e => { if (e.key === "Enter") adicionarItem(); });

    calcQtd.value = "1";
  </script>
</body>
</html>
